name: Self security report

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit own repository
        env:
          PYTHONPATH: src
          REPORTER_API_KEY: ${{ secrets.REPORTER_API_KEY }}
          REPORTER_MODEL: ${{ vars.REPORTER_MODEL }}
          REPORTER_API_URL: ${{ vars.REPORTER_API_URL }}
        run: python -m miner.reporter --repository "$GITHUB_WORKSPACE" --output .reporter-output/security-report.md
      - name: Store report, including incomplete audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-miner-security-report
          path: .reporter-output/security-report.md
          if-no-files-found: warn
          retention-days: 30
